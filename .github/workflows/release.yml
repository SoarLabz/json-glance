name: Publish release to npm
on:
  release:
    types: [published]
permissions:
  contents: read
concurrency:
  group: npm-release-${{ github.event.release.tag_name }}
  cancel-in-progress: false
jobs:
  validate:
    if: ${{ !github.event.release.prerelease && !github.event.release.draft }}
    uses: ./.github/workflows/validate.yml
  publish:
    needs: validate
    runs-on: ubuntu-24.04
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event.release.tag_name }}
          fetch-depth: 0
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: '22'
          registry-url: https://registry.npmjs.org
      - name: Use the pinned package manager
        run: npm install --global npm@11.20.0
      - name: Verify tag, version, checkout and main ancestry
        run: npm run release:check
        env:
          RELEASE_TAG: ${{ github.event.release.tag_name }}
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: npm-package
          path: release-package
      - name: Publish the validated tarball
        run: |
          tarball="./release-package/json-glance-$(node -p 'JSON.parse(require("fs").readFileSync("package.json", "utf8")).version').tgz"
          test -f "$tarball"
          npm publish "$tarball" --access public --provenance
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
